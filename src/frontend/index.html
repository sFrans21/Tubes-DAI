<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magic Cube Solver</title>
    <link rel="stylesheet" href="static/styles.css" />
  </head>
  <body>
    <header>
      <h1>Magic Cube Solver</h1>
    </header>

    <div id="cube-container">
      <!-- Input untuk jumlah populasi dan iterasi -->
      <div class="input-controls">
        <label for="population-size">Population Size:</label>
        <input type="number" id="population-size" min="1" value="50" />
        <br /><br />
        <label for="iterations">Iterations:</label>
        <input type="number" id="iterations" min="1" value="1000" />
        <br /><br />
        <button id="generate-input">Generate Cube</button>
      </div>

      <!-- Menampilkan hasil -->
      <div id="output-container">
        <h2>Results</h2>
        <pre id="output"></pre>
      </div>
    </div>

    <script>
      document
        .getElementById("generate-input")
        .addEventListener("click", async function () {
          const populationSize =
            document.getElementById("population-size").value;
          const iterations = document.getElementById("iterations").value;

          const response = await fetch("/solve_cube", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              population_size: populationSize,
              iterations: iterations,
            }),
          });

          const data = await response.json();
          document.getElementById("output").textContent = JSON.stringify(
            data.result,
            null,
            2
          );
        });
    </script>
  </body>
</html>
